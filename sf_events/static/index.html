<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* sf fog, with the bridge for the one accent */
    --fog: #e6eaee;
    --fog-2: #d9dee4;
    --card: #f4f6f8;
    --ink: #14202b;
    --ink-2: #4a5866;
    --ink-3: #8a96a3;
    --rule: #c3cad2;
    --bridge: #d0401f;
    --bridge-soft: rgba(208, 64, 31, 0.12);
    --live: #1f8a4c;
    /* one colour per source so a row's origin reads at a glance */
    --luma: #c2357a;
    --luma-soft: rgba(194, 53, 122, 0.12);
    --cv: #1f6fb8;
    --cv-soft: rgba(31, 111, 184, 0.12);
    --partiful: #6b4fd8;
    --partiful-soft: rgba(107, 79, 216, 0.14);
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fog: #0f161d;
      --fog-2: #182129;
      --card: #141d25;
      --ink: #e7ecf0;
      --ink-2: #a6b2bd;
      --ink-3: #6b7884;
      --rule: #2a3640;
      --bridge: #ef5a30;
      --bridge-soft: rgba(239, 90, 48, 0.16);
      --live: #4ccc7f;
      --luma: #f06aa8; --luma-soft: rgba(240, 106, 168, 0.16);
      --cv: #6db3f2; --cv-soft: rgba(109, 179, 242, 0.16);
      --partiful: #a894ff; --partiful-soft: rgba(168, 148, 255, 0.16);
    }
  }
  :root[data-theme="dark"] {
    --fog: #0f161d; --fog-2: #182129; --card: #141d25; --ink: #e7ecf0; --ink-2: #a6b2bd;
    --ink-3: #6b7884; --rule: #2a3640; --bridge: #ef5a30; --bridge-soft: rgba(239, 90, 48, 0.16); --live: #4ccc7f;
    --luma: #f06aa8; --luma-soft: rgba(240, 106, 168, 0.16); --cv: #6db3f2; --cv-soft: rgba(109, 179, 242, 0.16);
    --partiful: #a894ff; --partiful-soft: rgba(168, 148, 255, 0.16);
  }

  * { box-sizing: border-box; }
  html { background: var(--fog); }
  body {
    margin: 0;
    background: var(--fog);
    color: var(--ink);
    font: 15px/1.45 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--bridge); outline-offset: 2px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 80px; }

  /* top bar */
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--fog) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .bar {
    max-width: 1040px; margin: 0 auto; padding: 14px 16px 10px;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px;
  }
  h1 {
    margin: 0 auto 0 0;
    font: 600 34px/0.9 var(--display);
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  h1 small { display: block; font: 500 12px/1.4 var(--mono); color: var(--ink-3); text-transform: none; letter-spacing: 0; margin-top: 4px; }
  /* per source: name, count, last pull, refresh */
  .sources { display: flex; flex-wrap: wrap; gap: 6px; }
  .src {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--rule); border-radius: 6px; background: var(--card);
    padding: 5px 6px 5px 9px; font: 500 11px/1 var(--mono); color: var(--ink-2);
  }
  .src .nm { color: var(--ink); }
  .src .at { color: var(--ink-3); }
  .src.stale .at { color: var(--bridge); }
  .src.failed { border-color: var(--bridge); }
  .src.failed .at { color: var(--bridge); }
  .src button {
    border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
    font: 14px/1 var(--mono); padding: 2px 4px; border-radius: 4px;
  }
  .src button:hover { color: var(--bridge); background: var(--bridge-soft); }
  .src button[disabled] { animation: spin 1s linear infinite; cursor: progress; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .search {
    flex: 1 1 220px; max-width: 360px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
    padding: 7px 10px; font: 14px var(--body); color: var(--ink);
  }
  .search::placeholder { color: var(--ink-3); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--card); }
  .seg button {
    border: 0; background: transparent; color: var(--ink-2);
    font: 500 12px var(--mono); padding: 8px 11px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--fog); }

  /* category chips: format is one-of, topics are any-of */
  .chips { max-width: 1040px; margin: 0 auto; padding: 0 16px 8px; display: flex; flex-direction: column; gap: 4px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chiprow .lab { font: 500 10px/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; width: 44px; }
  .chip {
    border: 1px solid var(--rule); background: transparent; color: var(--ink-2); cursor: pointer;
    font: 500 11px/1 var(--mono); padding: 4px 8px; border-radius: 999px;
  }
  .chip .n { color: var(--ink-3); margin-left: 4px; }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--bridge-soft); border-color: var(--bridge); color: var(--bridge); }
  .chip[aria-pressed="true"] .n { color: var(--bridge); }
  .chip.more { border-style: dashed; color: var(--ink-3); }
  .chip.more:hover { color: var(--ink); }
  #topics .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--fog); }
  #topics .chip[aria-pressed="true"] .n { color: var(--fog); }
  .ev.src-luma .t { border-right-color: var(--luma); }
  .ev.src-cerebralvalley .t { border-right-color: var(--cv); }
  .ev.src-partiful .t { border-right-color: var(--partiful); }
  .pill.partiful { color: var(--partiful); background: var(--partiful-soft); }
  .pill.me { color: var(--ink-2); background: var(--fog-2); }
  #srcfilter button.is-partiful[aria-pressed="true"] { background: var(--partiful); color: #fff; }
  .ev.live .t { border-right-color: var(--live); }
  .pill { display: inline-block; font: 600 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; }
  .pill.luma { color: var(--luma); background: var(--luma-soft); }
  .pill.cv { color: var(--cv); background: var(--cv-soft); }
  .ev .host { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .ev .host .pills { display: flex; gap: 4px; }
  #srcfilter button.is-luma[aria-pressed="true"] { background: var(--luma); color: #fff; }
  #srcfilter button.is-cv[aria-pressed="true"] { background: var(--cv); color: #fff; }
  .ev .host-name { color: var(--ink-3); }
  /* score: a number whose weight grows with it, reasons in plain words */
  .score { font: 600 12px/1 var(--mono); color: var(--ink-3); min-width: 24px; text-align: right; }
  .score.mid { color: var(--ink-2); }
  .score.high { color: var(--bridge); }
  .ev .why { font: 400 11px/1.3 var(--mono); color: var(--ink-3); margin-top: 3px; }
  .ev .why b { font-weight: 500; color: var(--ink-2); }
  .ev .tags { font: 400 11px/1 var(--mono); color: var(--ink-3); margin-top: 3px; }
  .ev .guests { display: block; font: 500 11px/1.3 var(--mono); color: var(--ink-2); margin-top: 4px; }
  .ev .guests b { color: var(--bridge); font-weight: 600; }
  /* a real button sized for a finger, since a miss opens the event link around it */
  .ev .guests .open { display: inline-block; margin-left: 8px; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); cursor: pointer; }
  .ev .guests .open:hover { border-color: var(--bridge); color: var(--bridge); }
  .people { border-bottom: 1px solid var(--rule); background: var(--card); padding: 10px 8px 10px 90px; display: none; }
  .people.on { display: block; }
  .people .row { display: grid; grid-template-columns: 180px 1fr auto; gap: 10px; padding: 4px 0; font-size: 13px; }
  .people .row .nm { font-weight: 600; }
  .people .row .bio { color: var(--ink-2); }
  .people .row .lk a { font: 400 11px var(--mono); color: var(--ink-3); margin-left: 6px; }
  .people .tag { font: 500 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 4px; border-radius: 3px; background: var(--bridge-soft); color: var(--bridge); margin-left: 5px; vertical-align: 1px; }
  .people .meta { font: 400 11px var(--mono); color: var(--ink-3); margin-bottom: 6px; }
  .people .pfilter { width: 100%; max-width: 420px; background: var(--fog); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; font: 13px var(--body); color: var(--ink); margin-bottom: 8px; }
  .people .grp { font: 500 10px/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin: 10px 0 4px; }
  .people .row.stands .nm { color: var(--ink); }
  .people .row:not(.stands) .nm { font-weight: 500; color: var(--ink-2); }
  .people .hosted { color: var(--ink-3); font: 400 11px var(--mono); }
  .people .found { display: block; color: var(--ink); }
  .people .said { display: block; color: var(--ink-3); font-size: 12px; }
  .people .reason { display: block; color: var(--ink-2); font-size: 12px; font-style: italic; margin-top: 2px; }
  .people .conf { font: 400 10px var(--mono); color: var(--ink-3); }
  .people .meta .open { display: inline-block; margin-left: 6px; padding: 2px 7px; border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; color: var(--ink-2); }
  .orphans { margin: 18px 0 0; padding: 10px 14px; border-left: 3px solid var(--rule); font: 400 12px/1.5 var(--mono); color: var(--ink-2); }
  .orphans a { color: var(--ink); }
  @media (max-width: 640px) { .people { padding-left: 16px; } .people .row { grid-template-columns: 1fr; gap: 2px; } }
  .ev .tags span { margin-right: 8px; }

  /* the density rail: one bar per day, height is how busy */
  .rail {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
    gap: 3px; align-items: end;
    height: 92px; margin: 22px 0 6px; padding-bottom: 22px; position: relative;
  }
  .rail button {
    position: relative; border: 0; padding: 0; cursor: pointer; background: transparent;
    height: 100%; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .rail .bar-fill { background: var(--fog-2); border-radius: 2px 2px 0 0; min-height: 3px; transition: height .3s ease; }
  .rail button:hover .bar-fill, .rail button.on .bar-fill { background: var(--bridge); }
  .rail button.weekend .bar-fill { background: var(--rule); }
  .rail button.weekend:hover .bar-fill { background: var(--bridge); }
  .rail .lbl {
    position: absolute; left: 0; right: 0; bottom: -22px;
    font: 500 10px/1 var(--mono); color: var(--ink-3); text-align: center; white-space: nowrap; overflow: hidden;
  }
  .rail button.today .lbl { color: var(--bridge); }
  .rail .n {
    position: absolute; left: 0; right: 0; top: -14px;
    font: 500 10px/1 var(--mono); color: var(--ink-2); text-align: center; opacity: 0; transition: opacity .15s;
  }
  .rail button:hover .n, .rail button.on .n { opacity: 1; }
  .rail-cap { font: 400 12px var(--mono); color: var(--ink-3); margin: 0 0 18px; }
  /* dense rails (30d, all) only label mondays, so let those labels spill right */
  .rail.dense .lbl { text-align: left; overflow: visible; }
  @media (max-width: 640px) { .rail .lbl { font-size: 9px; } .rail:not(.dense) button:nth-child(2n) .lbl { display: none; } }

  /* days */
  .day { margin-top: 34px; scroll-margin-top: 170px; }
  .day h2 {
    display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
    font: 600 26px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em;
  }
  .day h2 .count { font: 400 12px var(--mono); color: var(--ink-3); }
  .day h2 .today-tag { font: 500 11px var(--mono); color: var(--bridge); background: var(--bridge-soft); padding: 2px 6px; border-radius: 3px; }
  .day h2::after { content: ""; flex: 1; border-top: 1px solid var(--rule); transform: translateY(-6px); }

  .ev {
    display: grid; grid-template-columns: 76px 1fr auto; gap: 2px 14px;
    padding: 10px 8px 10px 0; border-bottom: 1px solid var(--rule);
    text-decoration: none; position: relative;
  }
  .ev:hover { background: var(--card); }
  .ev:hover .name { color: var(--bridge); }
  .ev .t { grid-row: span 2; font: 500 13px/1.5 var(--mono); color: var(--ink-2); text-align: right; padding-right: 6px; border-right: 2px solid var(--rule); }
  .ev .t .live-dot { display: block; font-size: 10px; color: var(--live); letter-spacing: .08em; }
  .ev .t .tday { display: block; font-size: 10px; color: var(--ink-3); }
  .ev .name { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .ev .kind { font: 500 10px/1 var(--mono); color: var(--bridge); background: var(--bridge-soft); padding: 3px 5px; border-radius: 3px; vertical-align: 2px; margin-left: 6px; text-transform: uppercase; }
  .ev .host { grid-row: span 2; align-self: start; font: 400 12px/1.3 var(--mono); color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
  .ev .host .dom::after { content: " ↗"; }
  .ev .sub { color: var(--ink-2); font-size: 13.5px; }
  .ev .where { color: var(--ink); display: block; }
  .ev .sum { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  /* no hover expansion: it shifts the row's controls under the pointer. the full text is in the tooltip */
  @media (max-width: 640px) {
    .ev { grid-template-columns: 64px 1fr; }
    .ev .t { grid-row: span 3; font-size: 12px; }
    .ev .name, .ev .sub, .ev .host { grid-column: 2; }
    .ev .host { grid-row: auto; padding-top: 4px; flex-direction: row; align-items: center; gap: 8px; }
  }

  .empty { margin: 60px 0; text-align: center; color: var(--ink-2); font-size: 14px; }
  .empty b { display: block; font: 600 28px var(--display); text-transform: uppercase; color: var(--ink); margin-bottom: 6px; }
  .err { border-left: 3px solid var(--bridge); padding: 10px 14px; margin-top: 30px; color: var(--ink-2); font-size: 14px; }
  .err code { font: 12px var(--mono); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>SF events <small id="status">loading</small></h1>
    <div class="sources" id="sources" aria-label="Sources"></div>
    <input class="search" id="q" type="search" placeholder="Search names, places, hosts, summaries" aria-label="Search events" autocomplete="off">
    <div class="seg" id="srcfilter" role="group" aria-label="Source">
      <button data-src="" aria-pressed="true">all</button>
      <button data-src="luma" aria-pressed="false" class="is-luma">luma</button>
      <button data-src="cerebralvalley" aria-pressed="false" class="is-cv">cerebral valley</button>
      <button data-src="partiful" aria-pressed="false" class="is-partiful">partiful</button>
    </div>
    <div class="seg" id="sort" role="group" aria-label="Order">
      <button data-sort="time" aria-pressed="true">by time</button>
      <button data-sort="score" aria-pressed="false">by score</button>
    </div>
    <div class="seg" id="worth" role="group" aria-label="Worth it">
      <button data-worth="0" aria-pressed="true">all</button>
      <button data-worth="40" aria-pressed="false">worth it</button>
      <button data-worth="-1" aria-pressed="false" title="only events with a scraped guest list">scraped</button>
    </div>
    <div class="seg" id="range" role="group" aria-label="How far ahead">
      <button data-days="7" aria-pressed="true">7d</button>
      <button data-days="14" aria-pressed="false">14d</button>
      <button data-days="30" aria-pressed="false">30d</button>
      <button data-days="0" aria-pressed="false">all</button>
    </div>
  </div>
  <div class="chips" id="chips">
    <div class="chiprow" id="formats" role="group" aria-label="Format"></div>
    <div class="chiprow" id="topics" role="group" aria-label="Topic"></div>
  </div>
</header>

<main class="wrap">
  <nav class="rail" id="rail" aria-label="Events per day"></nav>
  <p class="rail-cap" id="railcap"></p>
  <div id="orphans"></div>
  <div id="list"></div>
</main>

<script>
(() => {
  const TZ = "America/Los_Angeles";
  const state = { days: 7, src: "", format: "", topics: new Set(), q: "", sort: "time", worth: 0, moreTopics: false, events: [], sources: [], orphans: [] };
  const $ = (s) => document.querySelector(s);
  let FORMATS = [], TOPICS = [];
  const PILL = {
    luma: { cls: "luma", label: "luma", name: "Luma" },
    cerebralvalley: { cls: "cv", label: "cv", name: "Cerebral Valley" },
    partiful: { cls: "partiful", label: "partiful", name: "Partiful" },
    scraped: { cls: "me", label: "scraped", name: "you, via the extension" },
  };

  // ymd in pacific so grouping matches what the cli prints
  const ymd = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: TZ });
  const todayYmd = () => new Date().toLocaleDateString("en-CA", { timeZone: TZ });
  const fmt = (iso, opt) => new Date(iso).toLocaleString("en-US", { timeZone: TZ, ...opt });
  const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } };
  const addDays = (ymdStr, n) => {
    const d = new Date(ymdStr + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };

  async function load() {
    $("#status").textContent = "loading";
    try {
      const r = await fetch("/api/events");
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.detail || `${r.status} ${r.statusText}`);
      state.events = body.events;
      state.sources = body.sources;
      state.orphans = body.orphan_guest_lists || [];
      FORMATS = body.formats; TOPICS = body.topics;
      render();
      renderSources();
    } catch (e) {
      $("#status").textContent = "could not load";
      $("#list").innerHTML = `<div class="err">Could not load events. Is the server running and online? <code>uv run sf-events-web</code><br><code>${esc(e.message)}</code></div>`;
    }
  }

  function visible() {
    const today = todayYmd();
    const end = state.days ? addDays(today, state.days) : null;
    const q = state.q.trim().toLowerCase();
    return state.events.filter((e) => {
      const d = ymd(e.start);
      if (end && d >= end) return false;
      if (state.worth === -1 && !e.guests) return false;
      if (state.worth > 0 && e.score < state.worth) return false;
      if (state.src && e.source !== state.src && !e.also.includes(state.src)) return false;
      if (state.format && e.format !== state.format) return false;
      if (state.topics.size && !e.topics.some((t) => state.topics.has(t))) return false;
      if (q) {
        const hay = `${e.name} ${e.where || ""} ${e.host || ""} ${e.summary || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function visibleExcept(skip) {
    const saved = { format: state.format, topics: state.topics };
    if (skip === "format") state.format = "";
    if (skip === "topics") state.topics = new Set();
    const out = visible();
    Object.assign(state, saved);
    return out;
  }

  // how many topic chips show before the rest fold behind "more"
  const TOPIC_FOLD = 12;

  function renderChips() {
    const byFormat = new Map(FORMATS.map((f) => [f, 0]));
    for (const e of visibleExcept("format")) byFormat.set(e.format, (byFormat.get(e.format) || 0) + 1);
    // chips with nothing behind them go away instead of sitting greyed out
    $("#formats").innerHTML = `<span class="lab">format</span>` + FORMATS
      .filter((f) => byFormat.get(f) || state.format === f)
      .map((f) => `<button class="chip" data-format="${f}" aria-pressed="${state.format === f}">${f}<span class="n">${byFormat.get(f) || 0}</span></button>`)
      .join("");

    const byTopic = new Map();
    for (const e of visibleExcept("topics")) for (const t of e.topics) byTopic.set(t, (byTopic.get(t) || 0) + 1);
    // biggest first, active ones always shown, the long tail folds
    const all = [...new Set([...TOPICS, ...byTopic.keys()])]
      .filter((t) => byTopic.get(t) || state.topics.has(t))
      .sort((a, b) => (byTopic.get(b) || 0) - (byTopic.get(a) || 0) || a.localeCompare(b));
    const shown = state.moreTopics ? all : all.filter((t, i) => i < TOPIC_FOLD || state.topics.has(t));
    const hidden = all.length - shown.length;
    $("#topics").innerHTML = `<span class="lab">topic</span>` + shown
      .map((t) => `<button class="chip" data-topic="${t}" aria-pressed="${state.topics.has(t)}">${esc(t)}<span class="n">${byTopic.get(t) || 0}</span></button>`)
      .join("") + (hidden > 0 ? `<button class="chip more" data-more="1">+${hidden} more</button>` : state.moreTopics && all.length > TOPIC_FOLD ? `<button class="chip more" data-more="0">less</button>` : "");
  }

  function render() {
    renderChips();
    const today = todayYmd();
    const evs = visible();
    const byDay = new Map();
    for (const e of evs) {
      const d = ymd(e.start);
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(e);
    }

    // rail covers the whole chosen range, including empty days, so gaps are visible
    const span = state.days || Math.max(1, Math.round((new Date([...byDay.keys()].pop() || today) - new Date(today)) / 864e5) + 1);
    const railDays = Math.min(span, 60);
    const max = Math.max(1, ...Array.from({ length: railDays }, (_, i) => (byDay.get(addDays(today, i)) || []).length));
    $("#rail").classList.toggle("dense", railDays > 21);
    $("#rail").innerHTML = Array.from({ length: railDays }, (_, i) => {
      const d = addDays(today, i);
      const n = (byDay.get(d) || []).length;
      const dt = new Date(d + "T12:00:00");
      const dow = dt.getDay();
      const cls = [n ? "" : "none", dow === 0 || dow === 6 ? "weekend" : "", d === today ? "today" : ""].join(" ");
      // dense rails label mondays, plus today unless a monday label is about to land on top of it
      const dense = railDays > 21;
      const showLbl = dense ? dow === 1 || (i === 0 && (8 - dow) % 7 >= 4) : true;
      const lbl = !showLbl ? "" : dense ? dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : dt.toLocaleDateString("en-US", { weekday: "short", day: "numeric" });
      return `<button class="${cls}" data-day="${d}" ${n ? "" : "disabled"} aria-label="${n} events on ${d}">
        <span class="n">${n}</span>
        <span class="bar-fill" style="height:${Math.round((n / max) * 100)}%"></span>
        <span class="lbl">${lbl}</span></button>`;
    }).join("");

    const now = Date.now();
    const sections = state.sort === "score"
      ? [["score", [...evs].sort((a, b) => b.score - a.score || a.start.localeCompare(b.start))]]
      : [...byDay.entries()];
    $("#list").innerHTML = sections.map(([d, list]) => {
      const dt = new Date(d + "T12:00:00");
      const heading = d === "score" ? "Most worth it first" : dt.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
      return `<section class="day" id="d-${d}">
        <h2>${heading}
          ${d === today ? '<span class="today-tag">today</span>' : ""}
          <span class="count">${list.length}</span></h2>
        ${list.map((e) => {
          const live = new Date(e.start).getTime() <= now && e.end && new Date(e.end).getTime() > now;
          const srcs = [e.source, ...e.also];
          return `<a class="ev ${live ? "live" : ""} src-${e.source}" href="${e.url}" target="_blank" rel="noopener">
            <span class="t">${state.sort === "score" ? `<span class="tday">${fmt(e.start, { weekday: "short", day: "numeric" })}</span>` : ""}${fmt(e.start, { hour: "numeric", minute: "2-digit" })}${live ? '<span class="live-dot">LIVE</span>' : ""}</span>
            <span class="name">${esc(e.name)}${e.kind ? `<span class="kind">${esc(e.kind)}</span>` : ""}</span>
            <span class="host"><span class="pills"><span class="score ${e.score >= 40 ? "high" : e.score >= 20 ? "mid" : ""}" title="how worth it this looks, 0 to 100">${e.score}</span>${srcs.map((s) => `<span class="pill ${PILL[s]?.cls || "cv"}" title="Listed by ${PILL[s]?.name || s}">${PILL[s]?.label || s}</span>`).join("")}</span><span class="dom">${esc(host(e.url))}</span></span>
            <span class="sub"><span class="where">${esc(e.where || "")}${e.host ? `<span class="host-name"> · ${esc(e.host)}</span>` : ""}</span>${e.summary ? `<span class="sum" title="${esc(e.summary)}">${esc(e.summary)}</span>` : ""}
              <span class="tags">${[e.format === "other" ? "" : e.format, ...e.topics].filter(Boolean).map((t) => `<span>#${esc(t)}</span>`).join("")}</span>
              ${e.score_reasons.length ? `<span class="why"><b>${e.score}</b> · ${esc(e.score_reasons.join(", "))}</span>` : ""}
              ${e.guests ? `<span class="guests">${guestLine(e.guests)}<span class="open" role="button" data-people="${esc(e.key)}">who is going</span></span>` : ""}</span>
          </a>${e.guests ? peoplePanel(e) : ""}`;
        }).join("")}
      </section>`;
    }).join("") || `<div class="empty"><b>Nothing here</b>Try a wider range, another format, or clear the search.</div>`;

    const span2 = state.days ? `next ${state.days} days` : "everything upcoming";
    $("#orphans").innerHTML = state.orphans.length
      ? `<div class="orphans">${state.orphans.length} scraped guest list${state.orphans.length > 1 ? "s" : ""} for events not in this window: ${state.orphans.map((o) => `<a href="${esc(o.event_url)}" target="_blank" rel="noopener">${esc(host(o.event_url))}/${esc(o.key.split(":")[1])}</a> (${esc(o.summary)})`).join(", ")}. Widen the range or they may have passed.</div>`
      : "";
    $("#railcap").textContent = `${evs.length} events, ${span2}. Bars are events per day, tap one to jump.`;
    $("#status").textContent = `${state.events.length} upcoming`;
  }

  function renderSources() {
    $("#sources").innerHTML = state.sources.map((s) => {
      const failed = s.last_run_ok === false;
      const at = failed ? "pull failed" : s.last_ok_at ? `pulled ${fmt(s.last_ok_at, { hour: "numeric", minute: "2-digit" })}` : "never pulled";
      let title = failed ? s.last_error : `rescrapes every ${s.every_minutes} min${s.next_due ? `, next ${fmt(s.next_due, { hour: "numeric", minute: "2-digit" })}` : ""}`;
      let desc = "";
      if (s.enrichment) {
        const e = s.enrichment;
        desc = `<span class="at">· ${e.done}/${e.total} described</span>`;
        title += `. descriptions for the next ${e.window_days} days: ${e.done} of ${e.total}, a pass every ${e.every_minutes} min`;
      }
      return `<span class="src ${failed ? "failed" : ""} ${s.due ? "stale" : ""}" title="${esc(title || "")}">
        <span class="nm">${esc(s.source)}</span><span>${s.count}</span><span class="at">${at}</span>${desc}
        <button data-rescrape="${esc(s.source)}" aria-label="Rescrape ${esc(s.source)} now" title="Rescrape now">↻</button></span>`;
    }).join("");
  }

  $("#sources").addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-rescrape]"); if (!b) return;
    b.disabled = true;
    try {
      const r = await fetch(`/api/rescrape/${b.dataset.rescrape}`, { method: "POST" });
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        $("#status").textContent = `${b.dataset.rescrape}: ${body.detail || r.statusText}`;
      }
    } finally {
      await load();
    }
  });

  function guestLine(g) {
    const c = g.counts;
    const bits = [`${c.guests} guests`];
    if (c.investor) bits.push(`<b>${c.investor} investors</b>`);
    if (c.founder) bits.push(`<b>${c.founder} founders</b>`);
    if (c.exec) bits.push(`${c.exec} execs`);
    if (c.researcher) bits.push(`${c.researcher} researchers`);
    return bits.join(" · ");
  }

  function peoplePanel(e) {
    const g = e.guests;
    return `<div class="people" id="p-${esc(e.key)}" data-key="${esc(e.key)}">
      <div class="meta">guest list scraped ${fmt(g.scraped_at, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · ${g.counts.with_bio} of ${g.counts.guests} have a bio</div>
      <input class="pfilter" type="search" placeholder="Filter ${g.counts.guests} guests by name, bio, tag" aria-label="Filter guests">
      <div class="plist">loading…</div>
    </div>`;
  }

  function personRow(p) {
    const roles = (p.tags || []).filter((t) => !t.startsWith("@")).slice(0, 2);
    const orgs = (p.tags || []).filter((t) => t.startsWith("@")).slice(0, 2);
    const found = p.headline ? `<span class="found">${esc(p.headline)}${p.confidence && p.confidence !== "high" ? ` <span class="conf">${esc(p.confidence)} confidence</span>` : ""}</span>` : "";
    const why = p.reason ? `<span class="reason">${esc(p.reason)}</span>` : "";
    return `<div class="row ${p.weight > 0 ? "stands" : ""}">
      <span class="nm">${esc(p.name)}${roles.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>
      <span class="bio">${found}${p.bio ? `<span class="said">${esc(p.bio)}</span>` : ""}${orgs.map((t) => ` <span class="tag">${esc(t)}</span>`).join("")}${p.hosted >= 3 ? `<span class="hosted"> · hosted ${p.hosted}</span>` : ""}${why}</span>
      <span class="lk">${(p.links || []).map((l) => `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(host(l))}</a>`).join("")}</span>
    </div>`;
  }

  // full lists are fetched when a panel opens, the events payload only carries the summary
  const peopleCache = new Map();
  async function fillPanel(panel) {
    const key = panel.dataset.key;
    if (!peopleCache.has(key)) {
      const r = await fetch(`/api/guests/${encodeURIComponent(key)}`);
      if (!r.ok) { panel.querySelector(".plist").textContent = "could not load the guest list"; return; }
      const body = await r.json();
      const lk = body.lookup || {};
      const meta = panel.querySelector(".meta");
      if (lk.enabled) meta.insertAdjacentHTML("beforeend", ` · looked up ${lk.looked_up} of ${lk.lookable}${lk.looked_up < lk.lookable ? ` <span class="open" data-lookup="${esc(key)}">look up more</span>` : ""}`);
      else meta.insertAdjacentHTML("beforeend", " · web lookup off (no keys in .env)");
      // everyone, tagged and weighted, notable first then alphabetical
      const byName = new Map(body.analysis.notable.map((p) => [p.name, p]));
      const all = body.guests.map((g) => byName.get(g.name) || { ...g, tags: g.tags || [], weight: 0 });
      all.sort((a, b) => (b.weight || 0) - (a.weight || 0) || a.name.localeCompare(b.name));
      peopleCache.set(key, all);
    }
    renderPeople(panel, peopleCache.get(key), panel.querySelector(".pfilter").value);
  }

  function renderPeople(panel, all, q) {
    q = (q || "").trim().toLowerCase();
    const rows = q ? all.filter((p) => `${p.name} ${p.bio || ""} ${(p.tags || []).join(" ")}`.toLowerCase().includes(q)) : all;
    const stand = rows.filter((p) => p.weight > 0), rest = rows.filter((p) => !(p.weight > 0));
    panel.querySelector(".plist").innerHTML =
      (stand.length ? `<div class="grp">${stand.length} stand out</div>` + stand.map(personRow).join("") : "") +
      (rest.length ? `<div class="grp">${rest.length} more</div>` + rest.map(personRow).join("") : "") +
      (!rows.length ? `<div class="grp">nobody matches</div>` : "");
  }

  // run one lookup pass for a list, then refetch it
  $("#list").addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-lookup]"); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    b.textContent = "looking up…";
    const key = b.dataset.lookup;
    const r = await fetch(`/api/lookup/${encodeURIComponent(key)}`, { method: "POST" });
    peopleCache.delete(key);
    const panel = document.getElementById("p-" + key);
    if (!r.ok) { b.textContent = "lookup failed"; return; }
    panel.querySelector(".meta").textContent = panel.querySelector(".meta").textContent.split(" · looked up")[0];
    fillPanel(panel);
  });

  $("#list").addEventListener("input", (ev) => {
    const f = ev.target.closest(".pfilter"); if (!f) return;
    const panel = f.closest(".people");
    if (peopleCache.has(panel.dataset.key)) renderPeople(panel, peopleCache.get(panel.dataset.key), f.value);
  });

  // the "who" toggle sits inside the row anchor, so stop the click from opening the event
  $("#list").addEventListener("click", (ev) => {
    const w = ev.target.closest("[data-people]"); if (!w) return;
    ev.preventDefault(); ev.stopPropagation();
    const panel = document.getElementById("p-" + w.dataset.people);
    if (!panel) return;
    panel.classList.toggle("on");
    if (panel.classList.contains("on")) fillPanel(panel);
  });

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function seg(id, key, parse) {
    $(id).addEventListener("click", (ev) => {
      const b = ev.target.closest("button"); if (!b) return;
      for (const x of $(id).children) x.setAttribute("aria-pressed", String(x === b));
      state[key] = parse(b.dataset[key]);
      render();
    });
  }
  seg("#range", "days", Number);
  seg("#srcfilter", "src", String);
  seg("#sort", "sort", String);
  seg("#worth", "worth", Number);
  $("#formats").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-format]"); if (!b) return;
    state.format = state.format === b.dataset.format ? "" : b.dataset.format;
    render();
  });
  $("#topics").addEventListener("click", (ev) => {
    const m = ev.target.closest("button[data-more]");
    if (m) { state.moreTopics = m.dataset.more === "1"; renderChips(); return; }
    const b = ev.target.closest("button[data-topic]"); if (!b) return;
    const t = b.dataset.topic;
    state.topics.has(t) ? state.topics.delete(t) : state.topics.add(t);
    render();
  });
  $("#q").addEventListener("input", (ev) => { state.q = ev.target.value; render(); });
  $("#rail").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-day]"); if (!b) return;
    for (const x of $("#rail").children) x.classList.toggle("on", x === b);
    document.getElementById("d-" + b.dataset.day)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  load();
})();
</script>
</body>
</html>
