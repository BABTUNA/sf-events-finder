[project]
name = "sf-events-finder"
version = "0.1.0"
description = "pull upcoming SF Bay Area AI events into one list, cerebral valley first, luma and x later"
readme = "README.md"
authors = [
    { name = "benjamin barrera", email = "benbarrera13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
sf-events = "sf_events.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sf_events"]
